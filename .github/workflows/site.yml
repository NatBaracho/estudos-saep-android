# Publica o site (pasta www/) na Cloudflare a cada push na main que mude o site.
# Precisa do secret CLOUDFLARE_API_TOKEN (token "Edit Cloudflare Workers"). Veja "Site online" no README.
name: Publicar site

on:
  push:
    branches: [main]
    paths: ["www/**", "wrangler.jsonc", ".github/workflows/site.yml"]
  workflow_dispatch:

jobs:
  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Publicar na Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::warning::Secret CLOUDFLARE_API_TOKEN não configurado: o site não foi publicado. Veja 'Site online' no README."
            exit 0
          fi
          npx --yes wrangler@4 deploy
